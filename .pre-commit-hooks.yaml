# Use from another repo's .pre-commit-config.yaml:
#
#   - repo: https://github.com/sadiasamia121912/tabaudit
#     rev: v0.2.0
#     hooks:
#       - id: tabaudit
#         args: ["--target", "label", "--fail-on", "high"]
#
# Runs `tabaudit gate` on every committed data file that matches `files`. Override `files`
# in your config to narrow it (e.g. ^data/.*\.csv$) and `args` to set the target column.
- id: tabaudit
  name: tabaudit (dataset health gate)
  description: Fail the commit if a data file has leakage, duplicates, label noise or schema problems above the chosen severity.
  entry: tabaudit gate
  language: python
  files: \.(csv|tsv|parquet|feather|jsonl)$
  pass_filenames: true
  require_serial: true
